spring:
  application:
    name: internship-tracker
  mvc:
    problemdetails:
      enabled: true
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    
app:
  jwt:
    secret: ${JWT_SECRET}
    expiry: 1h
  reminders:
    from: reminders@internship-tracker.local
    cron: "0 0 8 * * *"