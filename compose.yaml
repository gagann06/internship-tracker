services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=internshiptracker'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=internshiptracker'
    ports:
      - '5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internshiptracker -d internshiptracker"]
      interval: 2s
      retries: 15

  mailpit:
    image: 'axllent/mailpit:v1.31.4'
    ports:
      - '1025:1025'
      - '8025:8025'
  app:
    build: .
    profiles: ["app"]
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/internshiptracker
      SPRING_DATASOURCE_USERNAME: internshiptracker
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy