name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6

      # Tests only need some valid HS256 key, not the real one, so each run generates
      # a throwaway key instead of depending on a repository secret.
      - name: Generate a throwaway JWT signing key
        run: |
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "JWT_SECRET=$key" >> "$GITHUB_ENV"

      # Compiles, runs every test (Testcontainers uses the runner's Docker) and builds the jar.
      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7
